services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/myreact:${IMAGE_TAG}
    container_name: frontend
    restart: unless-stopped
    expose:
      - "4173"
    networks:
      - app-network

  mynginx:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/mynginx:${IMAGE_TAG}
    container_name: mynginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - menu-service
      - order-service
      - reservation-service
      - customer-service
      - kitchen-service
      - delivery-service
      - payment-service
      - notification-service
      - analytics-service
      - promotion-service
    networks:
      - app-network

  menu-service:
    build:
      context: ./services/menu-service
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/menu-service:${IMAGE_TAG}
    container_name: menu-service
    restart: unless-stopped
    expose:
      - "3101"
    networks:
      - app-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/order-service:${IMAGE_TAG}
