services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${DOCKER_USERNAME}/myreact:${IMAGE_TAG}

    container_name: frontend

    restart: unless-stopped

    ports:
      - "4173:4173"

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  mynginx:
    build:
      context: ./gateway
      dockerfile: Dockerfile

    image: ${DOCKER_USERNAME}/mynginx:${IMAGE_TAG}

    container_name: mynginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      frontend:
        condition: service_healthy

      menu-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

      reservation-service:
        condition: service_healthy

      customer-service:
        condition: service_healthy

      kitchen-service:
        condition: service_healthy

      delivery-service:
        condition: service_healthy

      payment-service:
        condition: service_healthy

      notification-service:
        condition: service_healthy

      analytics-service:
        condition: service_healthy

      promotion-service:
        condition: service_healthy

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  menu-service:
