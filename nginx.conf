events {}

http {
    upstream frontend { server frontend:4173; }
    upstream menu_service { server menu-service:3101; }
    upstream order_service { server order-service:3102; }
    upstream reservation_service { server reservation-service:3103; }
    upstream customer_service { server customer-service:3104; }
    upstream kitchen_service { server kitchen-service:3105; }
    upstream delivery_service { server delivery-service:3106; }
    upstream payment_service { server payment-service:3107; }
    upstream notification_service { server notification-service:3108; }
    upstream analytics_service { server analytics-service:3109; }
    upstream promotion_service { server promotion-service:3110; }

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Nginx is the gateway. Frontend assets are served by the frontend service.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/menu { proxy_pass http://menu_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/orders { proxy_pass http://order_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/reservations { proxy_pass http://reservation_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/customers { proxy_pass http://customer_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/kitchen { proxy_pass http://kitchen_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/delivery { proxy_pass http://delivery_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/payments { proxy_pass http://payment_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/notifications { proxy_pass http://notification_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/analytics { proxy_pass http://analytics_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/promotions { proxy_pass http://promotion_service; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    }
}
