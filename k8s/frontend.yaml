apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: restaurant-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: haemzay/frontend:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4173
          envFrom:
            - configMapRef:
                name: shared-env
          readinessProbe:
            tcpSocket:
              port: 4173
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 4173
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: restaurant-app
spec:
  selector:
    app: frontend
  ports:
    - port: 4173
      targetPort: 4173
  type: ClusterIP
