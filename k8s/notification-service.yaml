apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: restaurant-app
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: haemzay/notification-service:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3108
          envFrom:
            - configMapRef:
                name: shared-env
          readinessProbe:
            tcpSocket:
              port: 3108
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3108
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: restaurant-app
spec:
  selector:
    app: notification-service
  ports:
    - port: 3108
      targetPort: 3108
  type: ClusterIP
