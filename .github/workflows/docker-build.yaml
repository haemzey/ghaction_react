name: DOCKER BUILD
on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main
        types:
            - opened
            - reopened
            - synchronize

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docker-build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: myreact
                      context: ./
                      dockerfile: ./Dockerfile

                    - image: mynginx
                      context: ./
                      dockerfile: ./Dockerfile.nginx

                    - image: analytics-service
                      context: ./services/analytics-service
                      dockerfile: ./services/analytics-service/Dockerfile

                    - image: customer-service
                      context: ./services/customer-service
                      dockerfile: ./services/customer-service/Dockerfile

                    - image: delivery-service
                      context: ./services/delivery-service
                      dockerfile: ./services/delivery-service/Dockerfile

                    - image: kitchen-service
                      context: ./services/kitchen-service
                      dockerfile: ./services/kitchen-service/Dockerfile

                    - image: menu-service
                      context: ./services/menu-service
                      dockerfile: ./services/menu-service/Dockerfile

                    - image: notification-service
                      context: ./services/notification-service
                      dockerfile: ./services/notification-service/Dockerfile

                    - image: order-service
                      context: ./services/order-service
                      dockerfile: ./services/order-service/Dockerfile

                    - image: payment-service
                      context: ./services/payment-service
                      dockerfile: ./services/payment-service/Dockerfile

                    - image: promotion-service
                      context: ./services/promotion-service
                      dockerfile: ./services/promotion-service/Dockerfile

                    - image: reservation-service
                      context: ./services/reservation-service
                      dockerfile: ./services/reservation-service/Dockerfile

                    - image: integration-test
                      context: ./test/integration
                      dockerfile: ./test/integration/Dockerfile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Generate image metadata
              id: tag
              shell: bash
              run: |
                  IMAGE_TAG="v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
                  echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

                  cat > image-tag.env <<EOF
                  IMAGE_TAG=$IMAGE_TAG
                  COMMIT_SHA=$GITHUB_SHA
                  BUILD_RUN_ID=$GITHUB_RUN_ID
                  EOF

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push ${{ matrix.name }}
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}

                  push: true

                  tags: |
                      ${{ vars.DOCKER_USERNAME }}/${{ matrix.image }}:${{ steps.tag.outputs.IMAGE_TAG }}
                      ${{ vars.DOCKER_USERNAME }}/${{ matrix.image }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Upload image metadata
              uses: actions/upload-artifact@v4
              with:
                  name: image-tag-metadata
                  path: image-tag.env
                  if-no-files-found: ignore
                  retention-days: 7
