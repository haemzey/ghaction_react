name: SMOKE TEST
on:
  workflow_run:
    workflows:
      - DOCKER TEST
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke-test:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: analytics-service
            port: 3109

          - image: customer-service
            port: 3104

          - image: delivery-service
            port: 3106

          - image: kitchen-service
            port: 3105

          - image: menu-service
            port: 3101

          - image: notification-service
            port: 3108

          - image: order-service
            port: 3102

          - image: payment-service
            port: 3107

          - image: promotion-service
            port: 3110

          - image: reservation-service
            port: 3103

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download image metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: image-tag-metadata
          path: ./metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load workflow image tag
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail

          cat ./metadata/image-tag.env >> "$GITHUB_ENV"

          echo "IMAGE_TAG:"
          grep '^IMAGE_TAG=' ./metadata/image-tag.env

          echo "COMMIT_SHA:"
          grep '^COMMIT_SHA=' ./metadata/image-tag.env

          echo "BUILD_RUN_ID:"
          grep '^BUILD_RUN_ID=' ./metadata/image-tag.env

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull ${{ matrix.image }} image
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          echo "Pulling image:"
          echo "$IMAGE"
          docker pull "$IMAGE"

      - name: Start ${{ matrix.image }} container
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          CONTAINER_NAME: smoke-${{ matrix.image }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          echo "Starting container:"
          echo "$CONTAINER_NAME"

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${PORT}:${PORT}" \
            "$IMAGE"

      - name: Smoke test for ${{ matrix.image }} containers
        shell: bash
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          echo "Waiting for service on port $PORT..."

          for i in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              "http://localhost:${PORT}/health"; then

              echo "${{ matrix.image }} smoke test passed."

              exit 0
            fi

            echo " Retrying..."

            sleep 10

          done

          echo "Service failed health check."

          exit 1

      - name: Show ${{ matrix.image }} logs
        if: always()
        shell: bash
        env:
          CONTAINER_NAME: smoke-${{ matrix.image }}
        run: |
          docker logs "$CONTAINER_NAME" >> matrix.image_container_logs.txt

      - uses: actions/upload-artifact@v7
        with:
          name: matrix.image_container_logs
          path: matrix.image_container_logs.txt
          if-no-files-found: ignore

      - name: Remove ${{ matrix.image }} container
        if: always()
        shell: bash
        env:
          CONTAINER_NAME: smoke-${{ matrix.image }}
        run: |
          docker rm -f "$CONTAINER_NAME" || true
