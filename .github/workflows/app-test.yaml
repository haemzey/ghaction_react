name: APP TEST
on: 
    push:
        branches:
            - main 
    workflow_dispatch:
    
permissions:
    contents: read

env:
    NODE_VERSION: "24"

jobs:
    app-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  with:
                      cache: "npm"
                      cache-dependency-path: "./package*.json"

            - run: npm ci --omit=dev --no-audit --no-fund
              
            - run: npm install pylint bandit flake8 pytest
              
            - run: npm pylint $(git ls-files '*.cjs', '*.js', '*.jsx') | tee .txt
 
            - run: npm bandit $(git ls-files '*.cjs', '*.js', '*.jsx') | tee .txt
              
            - run: npm flake8 $(git ls-files '*.cjs', '*.js', '*.jsx') | tee .txt
              
            - run: npm pytest $(git ls-files '*.cjs', '*.js', '*.jsx') | tee .txt
              
            - run: |
                npm install build 
                npm run build | tee .txt

            - uses: actions/upload-artifact@v7
              with:
                  name:
                  path:
                      
            - uses: actions/upload-artifact@v7
              with:
                  name:
                  path:
                      
            - uses: actions/upload-artifact@v7
              with:
                  name:
                  path:
                      
            - uses: actions/upload-artifact@v7
              with:
                  name:
                  path:
                      
            - uses: actions/upload-artifact@v7
              with:
                  name:
                  path:
                          
